<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adidas</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/bootstrap-icons.svg">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/main4.css">
    <link rel="stylesheet" href="css/media.css">
</head>

<body>
    <header class="m-none s-none">
        <div class="row justify-between align-center">
            <div class="col logo">
                <div class="wrapper">
                    <picture class="team-image"><img
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcStOJVCwDNcif-1AbiFlPxrdMXIVPXGLW8s7cld7yqInnGCJTldBiciwF7c&s=10"
                            alt=""></picture>
                </div>
            </div>
            <div class="col menu">
                <div class="wrapper">
                    <nav>
                        <ul class="flex gap-20 align-center m-none mobile-menu">
                            <li><a href="home.html">Home</a></li>
                            <li><a href="product.html">Product</a></li>
                            <li><a href="cart.html">Cart</a></li>
                            <li class="title-radius black"><a href="login.html">Login</a></li>
                            <li><a href="register.html">Register</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
            <div class="col w-50 search w-m-100">
                <div class="wrapper">
                    <form action="#" method="get">
                        <label>
                            <input type="text" placeholder="Search ...">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </label>
                    </form>
                </div>
            </div>
            <div class="col">
                <div class="wrapper">
                    <picture class="team-image">
                        <a href="cart.html"><img src="https://cdn-icons-png.flaticon.com/512/1374/1374128.png"
                                alt=""></a>
                    </picture>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section>
            <div class="row section-main">

            </div>
        </section>
        <section id="hero">
            <div class="row justify-center align-center">
                <div class="col w-70">
                    <div class="wrapper h-100 border flex flex-col gap-10">
                        <div class="flex login justify-center">
                            <p> Login </p>
                        </div>
                        <form class=" flex flex-col gap-20" action="#" method="get">
                            <div class="main-form">
                                <label for="Email-login">
                                    Phone or Email
                                    <span class="required">*</span>
                                </label>
                                <input type="email" name="email" id="Email-login"
                                    placeholder="Enter your email or phone number">
                            </div>
                            <div class="main-form">
                                <label for="Password-login">
                                    Password
                                    <span class="required">*</span>
                                </label>
                                <input type="password" name="user_pasword" placeholder="Password">
                                <label for="">
                                    <input class="mr-5" type="checkbox" name="Show-me-password" value="See password">
                                    See password
                                </label>
                            </div>
                            <button class="btn bg-dark w-100">
                                Sigh In
                            </button>
                            <div class="flex gap-20 align-center">
                                <p class="text-2">Sigh In with</p>
                                <a class="btn icon" href="https://www.facebook.com/adidas/?locale=ru_RU">
                                    <img src="images/facebook-brands-solid-full.svg" alt="">
                                    <p>facebook</p>
                                </a>
                                <a class="btn" href="https://www.adidas.com/us">
                                    <img src="images/google-brands-solid-full.svg" alt="">
                                    <p>Google</p>
                                </a>
                                 <a class="btn" href="https://www.adidas.com/us">
                                    <img src="images/yandex-brands-solid-full.svg" alt="">
                                    <p>Yandex</p>
                                </a>
                            </div>
                            <p class="flex justify-center">
                                <a href="register.html"> Register</a>
                            </p>
                        </form>
                    </div>
                </div>
        </section>
    </main>


    <footer>
        <div class="row">
            <div class="col w-25 w-m-33 w-s-50">
                <h4>Adidas</h4>
            </div>
            <div class="col w-25 w-m-33 w-s-50">
                <div class="wrapper mb-24">
                    <h5>Company Info</h5>
                    <p>All Products</p>
                    <p>About Us</p>
                    <p>Privacy Policy</p>
                    <p>Terms of Service</p>
                </div>
            </div>
            <div class="col w-25 w-m-33 w-s-50">
                <div class="wrapper">
                    <h4>Subscribe</h4>
                    <p><a href="https://www.adidas.com/us">Adidas.com</a></p>
                    <label for="mail">Email:
                        <input type="email" name="user_name" placeholder="example@gmail.com">
                    </label>
                </div>
            </div>
            <div class="col w-25 w-m-33 w-s-50">
                <div class="wrapper">
                    <nav>
                        <ul class="flex gap-40">
                            <li>
                                <picture class="team-image">
                                    <a href="https://x.com/adidas"><img src="images/Social icon (1).png" alt=""></a>
                                </picture>
                            </li>
                            <li>
                                <picture class="team-image">
                                    <a href="https://de.linkedin.com/company/adidas"><img src="images/Social icon 1.png" alt=""></a>
                                </picture>
                            </li>
                            <li>
                                <picture class="team-image">
                                    <a href="https://www.instagram.com/adidas/"><img
                                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEpg90eKpKQNjJgwfM64pT5xckMEMdkj9rPLzlLjw0EtoNS_q_XYHUfFND&s=10"
                                        alt=""></a>
                                </picture>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
